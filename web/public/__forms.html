<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Forms</title><meta name="robots" content="noindex"></head>
<body>
<!-- Netlify detects this form at deploy time. Demo-Studio posts to it so Ani gets an e-mail per request. -->
<form name="demo-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="demo-request">
  <input name="bot-field">
  <input name="betrieb">
  <input name="branche">
  <input name="name">
  <input name="telefon">
  <input name="email">
  <input name="erreichbar">
  <input name="wuensche">
  <textarea name="eigene_worte"></textarea>
  <input name="demo_adresse">
</form>
</body>
</html>
